server:
  port: 8080

spring:
  application:
    name: dressme-gateway
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

# ── URLs de microservicios internos ───────────────────────────────────────────
app:
  services:
    backend-url: ${BACKEND_SERVICE_URL:http://dressme-back:8080}
  # ── Configuración de JWT ─────────────────────────────────────────────────
  security:
    jwt-secret: ${JWT_SECRET:dressme-secret-key-change-in-production-minimum-256-bits-required-12345}
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:24}

# ── Configuración de Google OAuth ─────────────────────────────────────────────
# La URL de validación de tokens de Google.
# El OAuthProviderService la usa para verificar el id_token del frontend.
google:
  oauth:
    userinfo-url: https://www.googleapis.com/oauth2/v3/userinfo

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
