server:
  port: 8080

spring:
  application:
    name: dressme-back
 
# ── Almacenamiento local de imágenes ──────────────────────────────────────────
# Leído por LocalStorageServiceImpl vía @Value.
storage:
  path: ${STORAGE_PATH:/app/images}
  base-url: ${STORAGE_BASE_URL:http://dressme-back:8080/images}
  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          dressme-database-color-client:
            connectTimeout: 2000
            readTimeout: 3000
          dressme-database-taste-client:
            connectTimeout: 2000
            readTimeout: 3000

# ── URLs de microservicios internos ───────────────────────────────────────────
app:
  services:
    database-url: ${DATABASE_SERVICE_URL:http://dressme-database:8080}
    ai-url: ${AI_SERVICE_URL:http://dressme-ai:8000}
  security:
    jwt-secret: ${JWT_SECRET:dressme-secret-key-change-in-production-minimum-256-bits-required-12345}

google:
  oauth:
    userinfo-url: https://www.googleapis.com/oauth2/v3/userinfo

logging:
  level:
    org.springframework.security: INFO