server:
  port: 8080
 
spring:
  application:
    name: dressme-back
 
# ── URLs de microservicios internos ───────────────────────────────────────────
# Leídas por OnboardingOrchestratorServiceImpl vía @Value.
# Los valores coinciden con los nombres de contenedor del docker-compose.yml.
app:
  services:
    database-url: ${DATABASE_SERVICE_URL:http://dressme-database:8080}
    ai-url: ${AI_SERVICE_URL:http://dressme-ai:8000}