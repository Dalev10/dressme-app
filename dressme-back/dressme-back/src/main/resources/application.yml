# ═══════════════════════════════════════════════════════════════════════════════════
# DRESSME BACKEND - CONFIGURACIÓN CORREGIDA (Nombres de red Docker)
# ═══════════════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: dressme-back

  datasource:
    # CORREGIDO: El nombre del host es 'dressme-db' y la DB es 'dressmedb' (según tu docker-compose y .env)
    url: jdbc:postgresql://dressme-db:5432/dressmedb
    username: user_admin
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

  web:
    cors:
      allowed-origins:
        - 'http://localhost:5173'
        - 'http://localhost:5174'
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowed-headers:
        - '*'
      expose-headers:
        - 'Authorization'
        - 'Content-Type'
      allow-credentials: true
      max-age: 3600

# ═══════════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN PERSONALIZADA DE DRESSME
# ═══════════════════════════════════════════════════════════════════════════════════

storage:
  path: /app/images
  base-url: http://dressme-back:8080/images

app:
  security:
    jwt-secret: 'dressme-secret-key-change-in-production-minimum-256-bits-required-12345'

  feign:
    ai-service-url: 'http://dressme-ai:8000'

  outfit-generation:
    top-n: 5

# ═══════════════════════════════════════════════════════════════════════════════════
# SERVIDOR (Tomcat)
# ═══════════════════════════════════════════════════════════════════════════════════

server:
  port: 8080
  servlet:
    context-path: /

# ═══════════════════════════════════════════════════════════════════════════════════
# LOGGING (Reducido para evitar saturación de consola en Docker)
# ═══════════════════════════════════════════════════════════════════════════════════

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.dressme.dressme_back: DEBUG
    feign: DEBUG
    org.springframework.security: INFO # Cambiado a INFO para que no llene el log de basura
    org.hibernate.SQL: INFO # Cambiado a INFO para rendimiento

---
# ═══════════════════════════════════════════════════════════════════════════════════
# PERFIL: PRODUCCIÓN
# ═══════════════════════════════════════════════════════════════════════════════════

spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt-secret: ${JWT_SECRET}
