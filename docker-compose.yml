services:
  dressme-db:
    image: ankane/pgvector:latest # Imagen oficial con soporte para vectores
    container_name: dressme-db
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: dressmedb
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password123
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - dressme-network

networks:
  dressme-network:
    driver: bridge